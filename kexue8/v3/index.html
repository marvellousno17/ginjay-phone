.serif{font-family:"Songti SC","Noto Serif SC",Georgia,serif}
.lead{color:var(--soft);margin:0 0 14px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.err{color:var(--rose);font-size:14px;min-height:22px;margin:4px 0}
.res .name{font:900 clamp(36px,8.5vw,52px)/1.1 "Songti SC","Noto Serif SC",Georgia,serif;margin:8px 0 6px;text-align:center}
.res .nick{color:var(--soft);margin:0 0 10px;text-align:center}
.pills{text-align:center}

.pill.hi{background:var(--goodbg);color:var(--good)}
.res .line{font:600 19px/1.5 "Songti SC","Noto Serif SC",Georgia,serif;margin:0 0 10px;text-align:center}
.small{font-size:13px;color:var(--soft);line-height:1.6}
.h{font-size:14px;font-weight:600;color:var(--ink);margin:20px 0 8px}
.note{background:var(--plumbg);border-radius:10px;padding:10px 13px;margin:10px 0;font-size:13px;color:var(--plum)}

.dim{display:grid;grid-template-columns:68px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.dim .dn{color:var(--soft);white-space:nowrap}

.dim.aux .dn{color:var(--plum);font-weight:700}
.dt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}

.dim.dom .dt i{background:var(--rose);opacity:1}
.dim.aux .dt i{background:var(--plum);opacity:.85}
.dim.peak .dn{color:#b7791f;font-weight:700}
.dim.peak .dt i{background:#d39a3a;opacity:1}
.pill.k{background:#fbf0dc;color:#8a5a12}
.why{border-top:1px solid var(--line);margin:16px 0 0;padding-top:12px}
.dv{font-variant-numeric:tabular-nums;color:var(--soft);text-align:right}
.land{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:0 0 6px;border:1px solid var(--line)}
.land span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

function build(flips){

  const mkS=(s,idx,ex)=>{const ord=sh(s.o.map((_,j)=>j));const b=s.base||BASE;ord.splice(Math.floor(Math.random()*(ord.length+1)),0,-1);return Object.assign({kind:'s',idx,t:s.t,o:s.o,l:s.l,base:b,w:s.w??1,ord},ex||{});};
  const mkP=(p,ex)=>{let f=FLIPS[pk];if(f===undefined){f=Math.random()<.5;FLIPS[pk]=f;}pk++;const r=f?{a:p.b,b:p.a}:{a:p.a,b:p.b};return Object.assign({kind:p.a[1].dir?'d':'x',a:r.a,b:r.b},ex||{});};
  SITU.slice(0,7).forEach((s,k)=>Q.push(mkS(s,k,k===0?{sec:SEC1}:null)));
  PAIR.slice(0,8).forEach((p,k)=>Q.push(mkP(p,k===0?{sec:SEC2}:null)));
  SITU.slice(7).forEach((s,k)=>Q.push(mkS(s,k+7,k===0?{sec:SEC3,stress:1}:{stress:1})));
  PAIR.slice(8).forEach((p,k)=>Q.push(mkP(p,k===0?{sec:SEC4}:null)));
  MOD.forEach((m,k)=>Q.push(Object.assign({kind:m.multi?'m':'o',k:m.k,t:m.t,o:m.o},k===0?{sec:SEC5}:null)));

}

function compute(){
  const raw={},wins={},sweet={},stress={};F.forEach(f=>{raw[f]=0;wins[f]=0;sweet[f]=0;stress[f]=0;});
  const ax={A:0,V:0,L:0,P:0};const land={'我':0,'她们之间':0,'某一方':0,'人群':0};const who={A:0,B:0,'两人':0};
  let na=0,sweetN=0,stressN=0;const mod={};
  Q.forEach((q,k)=>{
    const a=A[k];
    if(q.kind==='s'){
      if(q.w===0)return;
      if(a.p1===-1){na++;return;}
      const add=(j,w)=>{const f=F[j];raw[f]+=w;
        const L=(f==='Ai'||f==='Pi')?'我':(f==='Le')?'人群':(f==='Ae'||f==='Pe')?'某一方':'她们之间';land[L]+=w;
        if(f==='Ae')who[q.l[0]]+=w;if(f==='Pe')who[q.l[1]]+=w;};
      if(a.p1!==null&&a.p1>=0){add(a.p1,2);(q.stress?stress:sweet)[F[a.p1]]++;q.stress?stressN++:sweetN++;}
      if(a.p2!==null&&a.p2>=0)add(a.p2,1);
    }else if(q.kind==='d'){if(a.p1){const s=a.p1==='a'?q.a:q.b;raw[s[1].dir]++;wins[s[1].dir]++;}}
    else if(q.kind==='x'){if(a.p1){const s=a.p1==='a'?q.a:q.b;ax[s[1].axis]++;}}
    else{mod[q.k]=a.p1;}
  });
  const norm={};F.forEach(f=>norm[f]=raw[f]/MAXP*100);
  return {raw,norm,wins,ax,land,who,na,mod,sweet,stress,sweetN,stressN};
}
function bestAux(norm,wins,d){const [x1,x2]=AUX[d];if(Math.abs(norm[x1]-norm[x2])>=0.01)return {aux:norm[x1]>norm[x2]?x1:x2,tie:false};if(wins[x1]!==wins[x2])return {aux:wins[x1]>wins[x2]?x1:x2,tie:false};return {aux:x1,tie:true};}
function classify(c){
  const {norm,wins}=c;
  const rank=[...F].sort((x,y)=>(norm[y]-norm[x])||(wins[y]-wins[x])||0);
  const [d1,d2]=rank;const gap=norm[d1]-norm[d2];
  const {aux,tie:auxTie}=bestAux(norm,wins,d1);
  const alt=d2+bestAux(norm,wins,d2).aux;
  let level=gap>=GAP_HI?2:gap>=GAP_MIX?1:0;
  if(c.mod.state===0)level=Math.max(0,level-1);
  if(c.na>=3)level=Math.max(0,level-1);
  const conf=['低','中','高'][level];
  const auxWeak=norm[aux]<norm[d1]*AUX_WEAK;
  const mixed=gap<GAP_MIX;
  const top3=rank.slice(0,3);const dual=[];
  [['Ai','Ae','感'],['Vi','Ve','证'],['Li','Le','叙'],['Pi','Pe','主']].forEach(([x,y,n])=>{if(top3.includes(x)&&top3.includes(y))dual.push(n);});
  let pressure=null;
  if(c.sweetN&&c.stressN){let best=null,bd=0;F.forEach(f=>{const d=c.stress[f]/c.stressN-c.sweet[f]/c.sweetN;if(d>bd){bd=d;best=f;}});if(best&&bd>=0.33&&best!==d1)pressure=best;}
  let best=null,bestSum=-1;Object.keys(T).forEach(k=>{const x=k.slice(0,2),y=k.slice(2);const sm=norm[x]+norm[y];if(sm>bestSum+0.01||(Math.abs(sm-bestSum)<=0.01&&best&&norm[x]>norm[best.slice(0,2)])){bestSum=sm;best=k;}});
  const ruleSum=norm[d1]+norm[aux];
  const sameDir=d2[1]===d1[1]&&!AUX[d1].includes(d2);
  const useC=auxWeak&&gap>=0.01&&best!==d1+aux&&bestSum>ruleSum+0.01;
  return {dom:d1,d2,aux,auxTie,code:d1+aux,alt,gap,conf,auxWeak,mixed,dual,rank,pressure,best,bestSum,ruleSum,sameDir,useC};
}

function result(){
const c=compute();const r=classify(c);const lead=r.useC?r.best.slice(0,2):r.dom;const t=T[r.useC?r.best:r.code];
const big=lead[1]==='i'?'内磕':'外磕';const sch=SCH[lead[0]];
const ea=A[Q.length-1].p1;const egg=ea===null||ea<0?'就是问吃不吃饭吧':nm(EGG.o[ea]);
const notCP=c.mod.unit===3||c.na>=6;
let head,sub,line,desc;
if(r.gap<0.01){head='混合型';sub='「'+FN[r.dom]+'」与「'+FN[r.d2]+'」并列';line='你不在任何一个格子里，你在两者之间';desc='你的两个功能一样强。这不是没测准，而是你磕的时候本来就同时需要两样东西。';}
else if(r.useC){const bt=T[r.best];head=bt[0];sub=bt[1]+'　<span style="font-family:ui-monospace,monospace">'+r.best+'</span>　'+FN[r.best.slice(0,2)]+' + '+FN[r.best.slice(2)];line='「'+bt[2]+'」';desc=bt[3];}
else if(r.auxWeak){head='待显影 · '+FN[r.dom];sub='主导是「'+FN[r.dom]+'」，辅助功能还没成形';line='「'+FN[r.dom]+'」是你最先被击中的地方';desc='你的主导功能很清楚，但按现在的组合规则，能给它当辅助的两个功能分数都偏低。这往往说明你的第二强功能和主导同一方向，规则暂时装不下它，看看下面的八维得分和第二读法会更准。';}
else{head=t[0];sub=t[1]+'　<span style="font-family:ui-monospace,monospace">'+r.code+'</span>';line='「'+t[2]+'」';desc=t[3];}
let dims='<div class="dims">';
r.rank.forEach(f=>{const w=Math.max(2,Math.round(c.norm[f]));const cls=r.useC?(f===r.best.slice(0,2)?'dom':f===r.best.slice(2)?'aux':f===r.dom?'peak':''):(f===r.dom?'dom':(f===r.aux?'aux':''));dims+=`<div class="dim ${cls}"><span class="dn">${FN[f]}</span><div class="dt"><i style="width:${w}%"></i></div><span class="dv">${Math.round(c.norm[f])}</span></div>`;});
dims+='</div>';
const lt=Object.values(c.land).reduce((s,v)=>s+v,0)||1;
let landBar='<div class="land">'+Object.entries(c.land).map(([k,v])=>`<span style="width:${v/lt*100}%;background:${LANDC[k]}" title="${k}"></span>`).join('')+'</div><div class="legend">'+Object.entries(c.land).map(([k,v])=>`<span><i style="background:${LANDC[k]}"></i>${k} ${Math.round(v/lt*100)}%</span>`).join('')+'</div>';
const topLand=Object.entries(c.land).sort((x,y)=>y[1]-x[1])[0][0];
const LANDTXT={'我':'你常把自己放进这段关系里感受，或在她身上照见自己。','她们之间':'你的注意力大多落在「她俩之间」：关系本身的真假、来龙去脉和故事。','某一方':'你的注意力常落在她们各自身上：她好不好、她是什么样的人。','人群':'你的磕常常发生在人群里：和同担一起，糖才算完整。'};
let lean='';const wa=c.who.A,wb=c.who.B;
if(Math.max(wa,wb)>=4&&Math.max(wa,wb)>=2*Math.min(wa,wb)){const x=wa>wb?NA:NB;lean=`<div class="note">在「关注某一方」的那些时刻，你明显更常看向 ${x}。这是唯粉倾向的线索之一，但只是线索：很多 CP 粉也会偏爱其中一位。</div>`;}
let derive='';
if(!r.useC&&!r.auxWeak&&r.gap>=0.01){const [x1,x2]=AUX[r.dom];derive=`<div class="why"><p class="h" style="margin-top:0">八维得分怎么变成你的磕型</p><p class="small" style="color:var(--ink)">① 主导：八维里最高的是「${FN[r.dom]}」（${Math.round(c.norm[r.dom])}）。<br>② 辅助：规则要求辅助来自另一组、方向相反，所以只能在「${FN[x1]}」（${Math.round(c.norm[x1])}）和「${FN[x2]}」（${Math.round(c.norm[x2])}）里选，取高的「${FN[r.aux]}」。<br>③ ${FN[r.dom]} + ${FN[r.aux]} = ${t[0]}（${r.code}）。</p>${r.sameDir?`<p class="small">你的第二强功能「${FN[r.d2]}」和「${FN[r.dom]}」方向相同，规则不让它当辅助，所以它没进类型名。</p>`:''}</div>`;}
const ot=OUT[r.useC?r.best:r.code];let outlook='';
if(ot&&!(r.auxWeak&&!r.useC)){const lw=Math.max(c.who.A,c.who.B)>=3&&c.who.A!==c.who.B?(c.who.A>c.who.B?NA:NB):'';const dream=(r.rank.slice(0,2).includes('Ai'))&&c.land['我']/lt>=0.3;
outlook=`<div class="why"><p class="h" style="margin-top:0">你之后可能往哪走（推测）</p><p class="small" style="color:var(--ink)">转唯的可能：${ot[0]}。这种磕法常见的去向是：${ot[1]}。${lw?`如果真的转唯，从你的作答看，更可能看向 ${lw}。`:''}${dream?'你常把自己放进关系里感受，也可能慢慢往梦女方向走。':''}</p><p class="small">这是根据类型和你的作答推出来的倾向，不是预言。很多人一直都是 CP 粉，换了一对也照样磕。</p></div>`;}
let notes='';
if(notCP)notes+=`<div class="note">你选了较多「不适用」或说自己不太磕 CP，所以下面的结果只作好玩的参考。这套题主要是给正在磕一对真人 CP 的人设计的。</div>`;
if(r.mixed&&r.gap>=0.01)notes+=`<div class="note">你的「${FN[r.dom]}」和「${FN[r.d2]}」只差 ${Math.round(r.gap)} 分，属于混合型：另一种读法是「${T[r.alt][0]}」。两个都可以是你。</div>`;
if(r.auxTie)notes+=`<div class="note">你的两个辅助方向（${FN[AUX[r.dom][0]]}、${FN[AUX[r.dom][1]]}）几乎一样强，类型名里的辅助只是暂取其一。</div>`;
if(r.dual.length)notes+=`<div class="note">你的「${r.dual.join('」「')}」两端都强：同一件事，你既会向内感受，也会向外观察。这是内在张力，不是矛盾。</div>`;
if(r.pressure)notes+=`<div class="note">一到冷淡、传闻、散场这类时刻，你更常冒出「${FN[r.pressure]}」的念头，和平时不太一样。这是你在压力下的反应线索，不代表你的类型变了。</div>`;
if(c.mod.state===0)notes+=`<div class="note">你说最近这对 CP 发生了让你情绪起伏很大的事，结果可能更多反映你这阵子的状态。过一段时间再测，可能会不一样。</div>`;
const typeName=r.useC?(t[0]+' · '+t[1]+'（同方向双核）'):r.gap<0.01?('混合型（'+FN[r.dom]+'／'+FN[r.d2]+'）'):(r.auxWeak?head:(t[0]+' · '+t[1]));
const plain=s=>s.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const share=plain(`${CP?'磕「'+CP+'」的我':'我'}在「磕学八维」的主要读法是：${typeName}（${big} · ${sch} · 把握${r.conf}）\n${line}\n八维前三：${r.rank.slice(0,3).map(f=>FN[f]+Math.round(c.norm[f])).join(' / ')}\n注意力最常落在：${topLand}\n看到蛋炒饭，我的第一反应是：${egg}\n——一种自我探索的读法，不是心理诊断。`);
app.innerHTML=`<div class="card res">
<p class="small" style="margin:0;text-align:center">鉴定完毕，${CP?'磕「'+CP+'」时的你，主要读法是':'你磕这对 CP 时的主要读法是'}</p>
<p class="name">${head}</p><p class="nick">${sub}</p>
<div class="pills"><span class="pill">${big}</span><span class="pill">${sch}</span><span class="pill ${r.conf==='高'?'hi':''}">结果把握：${r.conf}</span>${r.useC||r.sameDir?'<span class="pill k">同方向双核</span>':''}</div>
<p class="line">${line}</p><p style="margin:0">${desc}</p>
${(r.useC||!r.auxWeak)&&r.gap>=0.01?`<p class="small" style="margin:10px 0 0">你可能不完全符合的地方：${t[4]}</p>`:''}
<p class="h">你的八维得分（0–100）</p>${dims}${r.useC?`<p class="small" style="margin:4px 0 0">橙色：单项最高　红、紫：构成类型名的一对</p><div class="why"><p class="h" style="margin-top:0">为什么不是「${FN[r.dom]}」打头</p><p class="small" style="color:var(--ink)">你单项最高的是${FN[r.dom]}（${Math.round(c.norm[r.dom])}），按原规则它是主导。但能给它当辅助的${FN[AUX[r.dom][0]]}（${Math.round(c.norm[AUX[r.dom][0]])}）、${FN[AUX[r.dom][1]]}（${Math.round(c.norm[AUX[r.dom][1]])}）都偏低${r.sameDir?`，而你真正的第二强功能${FN[r.d2]}（${Math.round(c.norm[r.d2])}）和${FN[r.dom]}方向相同，规则装不下它`:''}。所以按原规则，你是「待显影 · ${FN[r.dom]}」。</p><p class="small" style="color:var(--ink)">换个角度看，你最强的一对搭配是「${FN[r.best.slice(0,2)]} + ${FN[r.best.slice(2)]}」（${Math.round(r.bestSum)}），比原规则的「${FN[r.dom]} + ${FN[r.aux]}」（${Math.round(r.ruleSum)}）更高，所以主标题用${T[r.best][0]}。「${FN[r.dom]}」是你最常用的方式。</p></div>`:''}
${r.useC||r.mixed?'':`<p class="small" style="margin:6px 0 0">第二接近的读法：${T[r.alt][0]}（${T[r.alt][1]}）</p>`}
${derive}<p class="h">你的注意力落在哪里</p>${landBar}<p class="small" style="margin:8px 0 0">${LANDTXT[topLand]}</p>${lean}
${notes}${outlook}
<p class="small" style="margin:16px 0 0">看到蛋炒饭，你的第一反应是：${egg}</p>
<p class="small" style="margin:14px 0 0">这是你磕这一对 CP 时的一种读法，测的是习惯，不是能力，也不评价哪种磕法更高明，更不对真人关系做任何判断。结果把握低，说明你几种偏好很接近，换个时间或换一对 CP 再测，可能会不同。</p>
</div>
<p class="err" id="cpm" style="text-align:center" role="status"></p>
<div class="card" style="margin-top:14px"><p style="font-weight:500;margin:0 0 4px">帮作者一个小忙</p><p class="small" style="margin:0 0 10px">这个结果有多像你？选完后点「复制给作者的数据」，把复制的内容发给邀请你来测的人。数据不含你的名字。</p><div class="chips" id="rate">${[1,2,3,4,5].map(n=>`<button class="chip" data-n="${n}">${n}${n===1?' 完全不像':n===5?' 非常像':''}</button>`).join('')}</div><button class="btn" id="data" style="width:100%">复制给作者的数据</button><p class="err" id="dm" role="status"></p></div>
<div class="row"><button class="btn main" id="copy">复制分享文案</button><button class="btn" id="again">重新测</button></div>`;
let rate=null;document.querySelectorAll('#rate .chip').forEach(b=>b.onclick=()=>{rate=+b.dataset.n;document.querySelectorAll('#rate .chip').forEach(x=>x.classList.toggle('on',x===b));});
const modTxt=MOD.map(m=>{const v=c.mod[m.k];return m.k+'='+(v===undefined||v===null?'-':m.o[v]);}).join('；');
document.getElementById('data').onclick=()=>{const m=document.getElementById('dm');if(!rate){m.textContent='先选一下像不像你';return;}const d=`【磕学八维v3数据】CP=${plain(CP)||'-'}｜结果=${plain(typeName)}｜规则判定=${r.code}${r.useC?'｜C切换='+r.best:''}｜把握=${r.conf}｜像不像=${rate}/5｜八维=${F.map(f=>FN[f]+Math.round(c.norm[f])).join(',')}｜落点=${Object.entries(c.land).map(([k,v])=>k+Math.round(v/lt*100)).join(',')}｜A/B=${c.who.A}/${c.who.B}｜不适用=${c.na}｜压力=${r.pressure?FN[r.pressure]:'-'}｜${modTxt}｜蛋炒饭=${egg}`;try{navigator.clipboard.writeText(d).then(()=>{m.textContent='已复制，发给邀请你的人就好';},()=>{m.textContent='复制失败，可以截图这一页发过去';});}catch(e){m.textContent='复制失败，可以截图这一页发过去';}};
document.getElementById('copy').onclick=()=>{const m=document.getElementById('cpm');try{navigator.clipboard.writeText(share).then(()=>{m.textContent='已复制，去发给同担吧';},()=>{m.textContent='复制失败，可以直接截图';});}catch(e){m.textContent='复制失败，可以直接截图';}};
document.getElementById('again').onclick=()=>{store.del();intro();top();};
store.del();
}
if(typeof window!=='undefined')window.__kx={get Q(){return Q},get A(){return A},set A(v){A=v},build,compute,classify,SITU,PAIR,T,F};
intro();
}
</script>

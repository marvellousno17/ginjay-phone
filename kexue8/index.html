Pe:{need:'读懂一个人真实的样子',why:'比起关系的结论，你更好奇过程：她是怎么一点点变的？她自己意识到了吗？吸引你的，是一个人在一段关系里慢慢认识自己的样子。',hit:'她做了一件「以前的她绝不会做」的事',hurt:'她变得扁平，只剩人设。你最怕的不是没糖，是她身上不再有让你想读下去的东西'}
};
const AUXLINE={Ai:'你也会跟着心动，偶尔把自己放进去',Ae:'你也很心疼她们，希望她们被温柔以待',Vi:'你也相信她们之间是真的',Ve:'你也会去翻细节，想确认自己没看错',Li:'你也会在心里给她们补故事',Le:'你也需要同担，一起磕才完整',Pi:'你也会在她身上照见自己',Pe:'你也会好奇她这个人本来的样子'};
const T={
AiLe:['入戏者','CP 体验官','她们谈的恋爱，我也在谈','你想要的不只是糖，是那种「我们一起心动过」的热闹。你值得被这样热烈地爱着。'],
AiPe:['镜中人','小镜子','在她身上，看见被爱的自己','你在她身上看见的那个被偏爱的人，其实也可以是你。'],
AeLi:['撑伞人','晴雨伞','风雨来了，先替她们撑伞','你一直在替别人撑伞。偶尔，也让自己被照顾一下吧。'],
AePi:['点灯人','小夜灯','她们照亮过我，我为她们点灯','她们照亮过你的某段日子，这份感谢你一直记着。你自己也是会发光的人。'],
ViLe:['落锁人','小钥匙','锁死了，钥匙我吞了','你守着的不只是一对 CP，是你对真心的相信。别让任何人拿走它。'],
ViPe:['观星者','望远镜','我相信我看见的那道光','你相信自己看见的东西。这种笃定很珍贵，哪怕世界常常要你怀疑自己。'],
VeLi:['考古学家','小铲子','每一帧都是出土文物','你翻遍物料，是想确认爱真的可以被留下来。它可以的。'],
VePi:['拾光者','时光胶囊','她们的每个瞬间，我都存着','你存下的每一张图里，也有那段时间的你。那些日子没有白过。'],
LiAe:['产粮者','粮仓','现实不给的，我写给她们','你把温柔都写进了她们的故事里。你自己的故事，也值得一个好结局。'],
LiVe:['史官','起居注','这段关系的编年史，由我执笔','你记下的不是八卦，是一段你认真参与过的时光。'],
LeAi:['狂欢者','磕糖永动机','只要有糖，我就停不下来','你要的不是热闹本身，是被接住的热情。有人和你一起尖叫，你就不孤单。'],
LeVi:['传薪者','小火把','一个人磕不够，要大家一起磕','你把喜欢分享出去，是因为好东西不该只有一个人看见。你也是。'],
PeAi:['同行者','成长搭子','她往前走一步，我陪一步','你陪她走的每一步，也是你自己在慢慢长大。'],
PeVi:['知音','天气预报','她的每一点变化，我都先看见','你总能先看见别人的变化。也记得看看自己，你也变了很多。'],
PiAe:['向光者','向日葵','她在哪，我就朝向哪','你朝着她，其实是朝着想成为的自己。那个自己，已经在路上了。'],
PiVe:['寻路人','小地图','她走过的路，让我看见自己的路','你研究她走过的路，是在给自己找方向。你会找到的。']
};
const OUT={AiLe:'跳到下一对正在发糖的 CP',AiPe:'更关注其中一位，或往梦女方向走',AeLi:'转向更需要被心疼的那一位',AePi:'更关注其中一位，或安静退坑',ViLe:'长期坚守；但信念被打破时，可能一下子退坑',ViPe:'从关系慢慢转向其中一位',VeLi:'留守，成为圈里的资料库',VePi:'成为回望型老粉，或转去给其中一位存档',LiAe:'转向同人或原创创作',LiVe:'这段写完就收笔，再去写下一段',LeAi:'跟着热度去磕下一对',LeVi:'到别的圈子继续带大家一起磕',PeAi:'转向正在成长的那一位',PeVi:'转向变化更多、更耐读的那一位',PiAe:'她做出背离你期待的选择时，可能会退坑，去找下一束光',PiVe:'转唯，或者脱坑回到自己的生活'};
const EGG={t:'{A}：我今天不开心<br>{B}：要不要吃碗蛋炒饭？',o:[['我也想被人这样哄','有人会用最笨的方式，认真接住你。'],['这是只有她俩懂的暗号吧','那就当作只有你们知道的小秘密。'],['她们之前是不是提过蛋炒饭？我去翻翻','考古魂，连彩蛋都不放过。'],['就是问吃不吃饭吧','也对，有时候一碗饭就是全部的关心。']]};

const KEY='kexue8_v4';
let NA='',NB='',CP='',ORD=[],ANS=[],i=-1,lastAt=0,RATE=0;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=s=>s.replace(/\{A\}/g,esc(NA||'她')).replace(/\{B\}/g,esc(NB||'另一位'));
const sh=a=>{for(let x=a.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]];}return a;};
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};
const save=()=>store.set({NA,NB,CP,ORD,ANS,i});
const top=()=>{try{window.scrollTo({top:0})}catch(e){}};

function intro(){
 const s=store.get();const can=s&&s.ORD&&s.ANS&&s.i>=0;
 app.innerHTML=`<h1>磕学八维</h1><p class="lead serif" style="font-size:19px;color:var(--ink)">你在 CP 身上，投放的到底是什么？</p>
 <p class="lead">同样是磕一对，有人在找被偏爱的感觉，有人想确认真心存在，有人在她身上看见想成为的自己。24 道题，每题选一个，大约 4 分钟。</p>
 <div class="card"><label class="f" for="cp">你在磕哪一对？（可不填）</label><input id="cp" maxlength="20" placeholder="比如 CP 名或者两人名字" value="${esc(s?.CP||'')}">
 <div class="two"><div><label class="f" for="na">其中一位叫</label><input id="na" maxlength="10" placeholder="她" value="${esc(s?.NA||'')}"></div><div><label class="f" for="nb">另一位叫</label><input id="nb" maxlength="10" placeholder="另一位" value="${esc(s?.NB||'')}"></div></div>
 <p class="small" style="margin:0 0 14px">填了名字，题目里就会用她们的名字。谁填前面都一样，不分角色。</p>
 <div class="row" style="justify-content:flex-start;margin:0"><button class="btn main" id="go">开始测试</button>${can?'<button class="btn" id="re">继续上次</button>':''}</div></div>
 <p class="small" style="margin-top:18px">这是一种自我探索的读法，不是心理诊断。答案只存在你自己的手机里。</p>`;
 document.getElementById('go').onclick=()=>{CP=document.getElementById("cp").value.trim();NA=document.getElementById("na").value.trim();NB=document.getElementById("nb").value.trim();ORD=Q.map(q=>sh(Object.keys(q.o)));ANS=Q.map(()=>null);i=0;save();render();};
 if(can)document.getElementById('re').onclick=()=>{({NA,NB,CP,ORD,ANS,i}=s);if(i>=Q.length)result();else render();};
}

function render(){
 const q=Q[i];const sec=SECS.find(s=>s.at===i);
 let h=`<div class="bar"><i style="width:${Math.round(i/Q.length*100)}%"></i></div>`;
 if(sec)h+=`<div class="sec"><b>${sec.t}</b>${sec.d}</div>`;
 h+=`<p class="meta">${i+1} / ${Q.length}</p><p class="q">${nm(q.t)}</p>`;
 ORD[i].forEach(f=>{h+=`<button class="opt${ANS[i]===f?' p1':''}" data-f="${f}">${nm(q.o[f])}</button>`;});
 h+=`<div class="nav"><button class="btn" id="bk" ${i===0?'disabled':''}>上一题</button><button class="lnk" id="sk">这题跳过</button></div>`;
 app.innerHTML=h;top();lastAt=Date.now();
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Date.now()-lastAt<300)return;lastAt=Date.now();ANS[i]=b.dataset.f;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('p1',x===b));setTimeout(next,220);});
 document.getElementById('bk').onclick=()=>{if(i>0){i--;save();render();}};
 document.getElementById('sk').onclick=()=>{ANS[i]=null;next();};
}
function next(){i++;save();if(i>=Q.length)result();else render();}

function compute(){
 const cnt={},ap={},mot={};F.forEach(f=>{cnt[f]=0;ap[f]=0;mot[f]=0;});
 let answered=0;
 Q.forEach((q,k)=>{if(!ANS[k])return;answered++;Object.keys(q.o).forEach(f=>ap[f]++);cnt[ANS[k]]++;if(MOTIVE.includes(k))mot[ANS[k]]++;});
 const sc={};F.forEach(f=>sc[f]=ap[f]?Math.round(cnt[f]/ap[f]*100):0);
 const cmp=(x,y)=>(sc[y]-sc[x])||(mot[y]-mot[x])||(F.indexOf(x)-F.indexOf(y));
 const rank=[...F].sort(cmp);const dom=rank[0];
 const aux=[...AUX[dom]].sort(cmp)[0];
 const other=rank.find(f=>f!==dom&&f!==aux);
 return {sc,rank,dom,aux,other,code:dom+aux,answered};
}

function result(){
 const c=compute();
 if(c.answered<16){app.innerHTML=`<h1 class="serif">还差一点</h1><p class="lead">你跳过了 ${Q.length-c.answered} 题，答得太少，结果会不准。回去补几题吧。</p><div class="row" style="justify-content:flex-start"><button class="btn main" id="bk2">回去补题</button><button class="btn" id="rs">重新开始</button></div>`;
  document.getElementById("bk2").onclick=()=>{i=ANS.findIndex(a=>!a);if(i<0)i=0;render();};document.getElementById("rs").onclick=()=>{store.del();intro();};return;}
 const t=T[c.code],fx=FX[c.dom],ox=FX[c.other];
 const who=CP?`磕「${esc(CP)}」的你是`:'你是';
 let bars='';c.rank.forEach(f=>{const cls=f===c.dom?' dom':f===c.aux?' aux':'';bars+=`<div class="dim${cls}"><span class="dn">${FN[f]}</span><span class="dt"><i style="width:${c.sc[f]}%"></i></span><span class="dv">${c.sc[f]}</span></div>`;});
 const share=`${CP?'磕「'+CP+'」的我':'我'}是【${t[0]} · ${t[1]}】\n「${t[2]}」\n我磕的其实是：${fx.need}\n最戳我的：${fx.hit}\n我身上还有一点：${FN[c.other]}\n测测你在 CP 身上投放了什么 👉 ${location.href.split('#')[0]}`;
 app.innerHTML=`<div class="res">
 <p class="nick" style="margin-top:8px">${who}</p>
 <div class="name">${t[0]}</div>
 <p class="nick">${t[1]}</p>
 <p class="line">「${t[2]}」</p>
 <div class="need"><span>你磕的，其实是</span><b>${fx.need}</b></div>
 <p class="h">你为什么会磕${CP?'「'+esc(CP)+'」':'她们'}</p>
 <p>${nm(fx.why)}同时，${AUXLINE[c.aux]}。</p>
 <div class="pair"><div class="mini"><span>最戳你的</span>${fx.hit}</div><div class="mini cut"><span>最容易刀到你的</span>${fx.hurt}</div></div>
 <div class="whisper"><span>你没说出口的</span>${t[3]}</div>
 <p class="h">你身上还有一点「${FN[c.other]}」</p>
 <p>除了上面这些，你也在找：${ox.need}。所以有时候，你也会被「${ox.hit}」打动。</p>
 <p class="h">之后你可能往哪走（推测）</p>
 <p>${OUT[c.code]}。</p>
 <details><summary>看看你的八维得分</summary><p class="small">每一维在题目里出现 12 次，分数是你选它的比例。最高的一维决定你最在意什么，第二维决定你用什么方式去磕。</p><div class="dims">${bars}</div></details>
 <details id="egg"><summary>彩蛋题（不计分）</summary><p class="q" style="font-size:18px;margin-top:10px">${nm(EGG.t)}</p><div class="chips">${EGG.o.map((o,k)=>`<button class="chip" data-k="${k}">${o[0]}</button>`).join('')}</div><p class="small" id="eggr"></p></details>
 <p class="h">这个结果像你吗？</p>
 <div class="chips" id="rate">${['完全不像','不太像','一半一半','挺像','说中了'].map((s,k)=>`<button class="chip${RATE===k+1?' on':''}" data-r="${k+1}">${s}</button>`).join('')}</div>
 <div class="row"><button class="btn main" id="cpy">复制分享文案</button><button class="btn" id="dat">复制数据给作者</button><button class="btn" id="again">重新测</button></div>
 <p class="small" id="msg" style="text-align:center;min-height:20px"></p>
 <p class="small" style="text-align:center">一种自我探索的读法，不是心理诊断。</p></div>`;
 top();
 const msg=s=>{document.getElementById('msg').textContent=s;};
 const copy=txt=>{const ok=()=>msg('已复制');const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){msg('复制失败，请长按手动复制');}ta.remove();};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,fb);else fb();};
 document.getElementById("cpy").onclick=()=>copy(share);
 document.getElementById("dat").onclick=()=>copy(`【磕学八维v4数据】CP=${CP}|型=${c.code}|分=${F.map(f=>f+c.sc[f]).join(',')}|答=${ANS.map(a=>a||'-').join('')}|像不像=${RATE||'-'}`);
 document.getElementById("again").onclick=()=>{store.del();RATE=0;intro();};
 document.querySelectorAll('#rate .chip').forEach(b=>b.onclick=()=>{RATE=+b.dataset.r;document.querySelectorAll('#rate .chip').forEach(x=>x.classList.toggle('on',x===b));msg('谢谢！可以点「复制数据给作者」发给作者');});
 document.querySelectorAll('#egg .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#egg .chip').forEach(x=>x.classList.toggle('on',x===b));document.getElementById("eggr").textContent=EGG.o[+b.dataset.k][1];});
}
intro();

})();
</script>
</body>
</html>
